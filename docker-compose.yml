version: '3.8'

services:
  # Database Layer
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: school_erp_user
      POSTGRES_PASSWORD: secure_password_change_in_production
      POSTGRES_DB: school_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_erp_user -d school_erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache & Message Broker Layer
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=school_erp_user
      - POSTGRES_PASSWORD=secure_password_change_in_production
      - POSTGRES_DB=school_erp_db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CACHE_URL=redis://redis:6379/2
      # Overrides DB connection to use the dockerized postgres
      - DATABASE_URL=postgresql+asyncpg://school_erp_user:secure_password_change_in_production@db:5432/school_erp_db
      - SECRET_KEY=dummy_secret_key_for_dev_only
      - ENCRYPTION_KEY=dummy_encryption_key_for_dev_only_32_chars!
      - MPESA_CONSUMER_KEY=dummy
      - MPESA_CONSUMER_SECRET=dummy
      - MPESA_PASSKEY=dummy
      - MPESA_CALLBACK_URL=http://localhost/api/mpesa
      - MPESA_EXPRESS_CALLBACK_URL=http://localhost/api/mpesa
      - AT_USERNAME=dummy
      - AT_API_KEY=dummy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  # Celery Worker (Background Tasks like SMS, Reports)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A src.main.celery_app worker --loglevel=info
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=school_erp_user
      - POSTGRES_PASSWORD=secure_password_change_in_production
      - POSTGRES_DB=school_erp_db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql+asyncpg://school_erp_user:secure_password_change_in_production@db:5432/school_erp_db
      - SECRET_KEY=dummy_secret_key_for_dev_only
      - ENCRYPTION_KEY=dummy_encryption_key_for_dev_only_32_chars!
      - MPESA_CONSUMER_KEY=dummy
      - MPESA_CONSUMER_SECRET=dummy
      - MPESA_PASSKEY=dummy
      - MPESA_CALLBACK_URL=http://localhost/api/mpesa
      - MPESA_EXPRESS_CALLBACK_URL=http://localhost/api/mpesa
      - AT_USERNAME=dummy
      - AT_API_KEY=dummy
    depends_on:
      - db
      - redis

  # React Frontend (Nginx Proxy)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:80"  # Exposing to standard Vite port for convenience, mapping to Nginx 80
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

